# Nginx configuration for aaPanel
# This file provides the nginx rewrite rules needed for the application

# Add this to your site configuration in aaPanel
# Site Settings -> Config Files -> Configuration File

# Example configuration:
server {
    listen 80;
    listen 443 ssl http2;
    server_name websekolah.gdvmedia.my.id;
    
    # SSL configuration (if using HTTPS)
    # ssl_certificate /path/to/certificate.crt;
    # ssl_certificate_key /path/to/private.key;
    
    # Document root should point to the public folder
    root /www/wwwroot/websekolah.gdvmedia.my.id/public;
    index index.php index.html;
    
    # Access and error logs
    access_log /www/wwwlogs/websekolah.gdvmedia.my.id.log;
    error_log /www/wwwlogs/websekolah.gdvmedia.my.id.error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~* /(config|app|database)/.*\.php$ {
        deny all;
    }
    
    # Allow static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
    
    # Main location block - route everything through index.php
    location / {
        try_files $uri $uri/ /index.php?url=$uri&$args;
    }
    
    # PHP processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # PHP settings
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 4 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 128k;
    }
    
    # Deny access to .htaccess files (not used by nginx)
    location ~ /\.htaccess {
        deny all;
    }
}
